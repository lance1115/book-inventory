<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#173f35" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="书库" />
    <title>书库扫码库存</title>
    <link rel="manifest" href="./manifest.json?v=20260518" />
    <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <link rel="stylesheet" href="./styles.css?v=20260518c" />
    <script defer src="./vendor/zxing-browser.min.js?v=20260518"></script>
    <script defer src="./app.js?v=20260518c"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">本机图书库存</p>
          <h1>书库扫码库存</h1>
          <p class="header-note">Safari 摄像头直扫 ISBN，数据只保存在这台手机。</p>
        </div>
        <button class="ghost-button" id="installButton" hidden type="button">添加到主屏幕</button>
      </header>

      <section class="stats-grid" aria-label="库存概览">
        <article class="stat-card">
          <span>图书种类</span>
          <strong id="statKinds">0</strong>
        </article>
        <article class="stat-card">
          <span>库存总数</span>
          <strong id="statTotal">0</strong>
        </article>
        <article class="stat-card">
          <span>低库存</span>
          <strong id="statLow">0</strong>
        </article>
      </section>

      <section class="panel scanner-panel" aria-labelledby="scannerTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">实时扫码</p>
            <h2 id="scannerTitle">扫码处理</h2>
          </div>
          <span class="pill" id="secureState">检查环境</span>
        </div>

        <div class="mode-switch" role="group" aria-label="扫码模式">
          <button class="mode-button active" data-mode="in" type="button">入库 +1</button>
          <button class="mode-button" data-mode="out" type="button">出库 -1</button>
          <button class="mode-button" data-mode="lookup" type="button">只查询</button>
        </div>

        <div class="scan-stage">
          <video id="preview" playsinline muted autoplay></video>
          <div class="scan-reticle" aria-hidden="true">
            <span></span>
          </div>
          <div class="empty-camera" id="cameraHint">
            <strong>点击“开始扫码”</strong>
            <span>把书背面 978 / 979 条形码横向放进框线</span>
          </div>
        </div>

        <div class="scanner-actions">
          <button class="primary-button" id="startScan" type="button">开始扫码</button>
          <button class="secondary-button" id="stopScan" disabled type="button">停止</button>
          <button class="secondary-button" id="torchButton" hidden type="button">补光灯</button>
        </div>

        <label class="photo-upload">
          <span>拍照/相册辅助识别</span>
          <input id="photoInput" accept="image/*" capture="environment" type="file" />
        </label>

        <div class="status-card" id="scanStatus" role="status">
          摄像头扫码是主流程；拍照识别用于条码反光、过小或距离太远时辅助。
        </div>
      </section>

      <section class="panel quick-entry" aria-labelledby="manualTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">补录</p>
            <h2 id="manualTitle">手动 ISBN / 书名</h2>
          </div>
        </div>
        <form id="manualForm" class="manual-form">
          <label>
            <span>ISBN / 条形码</span>
          <input id="manualIsbn" inputmode="numeric" autocomplete="off" enterkeyhint="next" placeholder="例如 978..." />
        </label>
        <label>
          <span>书名</span>
            <input id="manualTitleInput" autocomplete="off" enterkeyhint="next" placeholder="自动查询失败时填写" />
        </label>
        <label>
          <span>数量变化</span>
            <input id="manualDelta" inputmode="numeric" type="number" value="1" enterkeyhint="done" />
        </label>
          <button class="primary-button" type="submit">保存库存</button>
        </form>
      </section>

      <section class="panel inventory-panel" aria-labelledby="inventoryTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">查询</p>
            <h2 id="inventoryTitle">库存检索</h2>
          </div>
          <button class="ghost-button danger" id="clearAll" type="button">清空</button>
        </div>

        <div class="search-box">
          <input id="searchInput" autocomplete="off" placeholder="输入书名或 ISBN 查询库存" />
          <button id="exportButton" class="secondary-button" type="button">导出</button>
        </div>

        <div class="inventory-list" id="inventoryList" aria-live="polite"></div>
      </section>

      <section class="panel history-panel" aria-labelledby="historyTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">最近记录</p>
            <h2 id="historyTitle">出入库流水</h2>
          </div>
        </div>
        <div class="history-list" id="historyList"></div>
      </section>
    </main>

    <template id="bookRowTemplate">
      <article class="book-row">
        <div>
          <strong class="book-title"></strong>
          <span class="book-meta"></span>
        </div>
        <div class="quantity-control">
          <button class="small-button minus" type="button" aria-label="减少库存">-</button>
          <b class="book-count"></b>
          <button class="small-button plus" type="button" aria-label="增加库存">+</button>
        </div>
      </article>
    </template>
  </body>
</html>
